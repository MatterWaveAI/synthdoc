[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthdoc"
version = "0.1.0"
description = "Synthetic document generator with pixel-accurate entity annotations for NER and document AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MatterWave AI" }]
keywords = ["synthetic-data", "document-ai", "ner", "ocr", "dataset", "layout", "annotation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "faker>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "playwright>=1.20",
    "pymupdf>=1.21",
    "pillow>=9.0",
    "rdflib>=6.0",
    "python-barcode>=0.15",
]

[project.optional-dependencies]
# Alternative PDF backends; Paged.js through Playwright is the default.
pdf = ["weasyprint>=52.0", "pdf2image>=1.16"]
# Validate generated documents against the published JSON schema.
validate = ["jsonschema>=4.0", "click>=8.0"]
# Overlay and chart helpers.
viz = ["matplotlib>=3.5", "numpy>=1.21"]
# The NER / OCR benchmark harness.
bench = [
    "pandas>=1.3",
    "numpy>=1.21",
    "matplotlib>=3.5",
    "torch",
    "transformers",
    "huggingface_hub",
    "pytesseract",
    "spacy",
]
dev = ["pytest>=7.0", "jsonschema>=4.0", "click>=8.0"]

[project.scripts]
synthdoc = "synthdoc.cli:main"
synthdoc-bench = "synthdoc.bench.__main__:main"

[project.urls]
Homepage = "https://github.com/matterwaveai/synthdoc"
Repository = "https://github.com/matterwaveai/synthdoc"
Issues = "https://github.com/matterwaveai/synthdoc/issues"

[tool.setuptools.packages.find]
where = ["src"]
# A local clone of synthdoc-templates; it is distributed separately.
exclude = ["synthdoc.templates.library", "synthdoc.templates.library.*"]

[tool.setuptools.package-data]
# Templates are HTML/CSS/JS beside their Python; ontologies, schemas and the
# Paged.js polyfill are read at runtime.
"*" = ["*.html", "*.css", "*.js", "*.json", "*.ttl", "*.yaml", "*.yml", "*.md"]
# v1.0 is not an importable package name, so its schemas are listed from the parent.
"synthdoc.schemas" = ["v1.0/*.json", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
